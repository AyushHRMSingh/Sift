{% from "icons.html" import icon %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobSpy</title>
<script nonce="{{ request.state.nonce }}">try { document.documentElement.dataset.theme = localStorage.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) {}</script>
<style>
:root { --bg:#f3f1ec; --fg:#1a1917; --mut:#77736b; --line:#dcd8cf; --acc:#c8452c; --ease:cubic-bezier(.2,.7,.2,1) }
:root[data-theme=dark] { --bg:#131211; --fg:#ecebe6; --mut:#8d8a83; --line:#2a2825; --acc:#e2674d }
@media (prefers-color-scheme: dark) { :root:not([data-theme]) { --bg:#131211; --fg:#ecebe6; --mut:#8d8a83; --line:#2a2825; --acc:#e2674d } }
:root { color-scheme:light } :root[data-theme=dark] { color-scheme:dark }
* { box-sizing:border-box }
html { -webkit-text-size-adjust:100% }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:-.003em; animation:fade .35s var(--ease) }
@keyframes fade { from { opacity:0; transform:translateY(6px) } }
@media (prefers-reduced-motion: reduce) { *, body { animation:none !important; transition:none !important } }
a { color:inherit; text-decoration:none }
h1,h2,h3 { font-weight:500; margin:0 0 .4em; line-height:1.2; letter-spacing:-.015em }
h2.title { font:400 1.9rem/1.15 ui-serif,"New York",Georgia,serif; letter-spacing:-.02em }
h3 { font-size:.75rem; text-transform:uppercase; letter-spacing:.09em; color:var(--mut); font-weight:500; margin-top:1.6em }
.mut { color:var(--mut) } .small { font-size:.85rem } .num { font-variant-numeric:tabular-nums }
svg.i { width:1.05em; height:1.05em; vertical-align:-.17em; stroke:currentColor; fill:none; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round }

nav { display:flex; gap:22px; align-items:baseline; padding:18px 24px; max-width:720px; margin:0 auto }
nav .brand { font-weight:600; letter-spacing:-.02em; margin-right:auto }
nav a, nav button { color:var(--mut); transition:color .15s; padding:0; border:0; background:none; font-size:inherit }
nav a:hover, nav a.on, nav button:hover { color:var(--fg) }
nav a.on { box-shadow:0 1.5px 0 var(--fg) } nav form { margin:0 }
main { max-width:720px; margin:0 auto; padding:8px 24px 120px }

button,.btn { font:inherit; font-size:.9rem; cursor:pointer; color:var(--fg); background:transparent; border:1px solid var(--line); padding:8px 14px; border-radius:6px;
  display:inline-flex; gap:7px; align-items:center; transition:border-color .15s, background .15s, color .15s, transform .12s var(--ease) }
button:hover,.btn:hover { border-color:var(--fg) } button:active,.btn:active { transform:scale(.97) } button:disabled { opacity:.35; pointer-events:none }
.primary { background:var(--fg); color:var(--bg); border-color:var(--fg) } .primary:hover { opacity:.85 }
.save { background:var(--acc); border-color:var(--acc); color:#fff } .save:hover { border-color:var(--acc); opacity:.88 }
.danger:hover { color:var(--acc); border-color:var(--acc) }
.link { border:0; padding:0; color:var(--mut) } .link:hover { color:var(--fg) }

input,select,textarea { font:inherit; color:var(--fg); background:transparent; border:1px solid var(--line); border-radius:6px; padding:8px 10px; width:100%; transition:border-color .15s }
input:focus,textarea:focus { outline:0; border-color:var(--fg) } input[type=checkbox] { width:auto; accent-color:var(--fg) }
label { display:block; margin:14px 0 5px; color:var(--mut); font-size:.85rem }
.checks label { display:inline-flex; gap:7px; align-items:center; margin:4px 16px 4px 0; color:var(--fg); font-size:.9rem }

.card { border-top:1px solid var(--line); padding:22px 0; margin:0 }
.row { display:flex; gap:12px; align-items:center; flex-wrap:wrap } .grow { flex:1; min-width:0 }
table { width:100%; border-collapse:collapse } td,th { text-align:left; padding:9px 8px 9px 0; border-bottom:1px solid var(--line); vertical-align:baseline; font-weight:400 }
th { color:var(--mut); font-size:.75rem; text-transform:uppercase; letter-spacing:.08em }
.bar { height:3px; background:var(--line); min-width:80px } .bar>i { display:block; height:100%; background:var(--fg); transform-origin:left; animation:grow .6s var(--ease) }
@keyframes grow { from { transform:scaleX(0) } }
.err { color:var(--acc) }
#theme { padding:0; border:0; display:inline-flex } #theme .sun { display:none } [data-theme=dark] #theme .sun { display:inline } [data-theme=dark] #theme .moon { display:none }

.tag { display:inline-flex; align-items:center; gap:6px; font-size:.85rem; margin:2px 16px 2px 0 }
.tag::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--fg) }
.tag.miss { color:var(--mut) } .tag.miss::before { background:none; box-shadow:inset 0 0 0 1px var(--mut) }
.tabs { display:flex; gap:20px; margin:8px 0 18px } .tabs a { color:var(--mut); transition:color .15s } .tabs a.on, .tabs a:hover { color:var(--fg) } .tabs a.on { box-shadow:0 1.5px 0 var(--fg) }
</style>
</head>
<body>
{% if path != '/login' %}
<nav>
  <a class="brand" href="/">JobSpy</a>
  <a href="/" class="{{ 'on' if path == '/' }}">Swipe</a>
  <a href="/saved" class="{{ 'on' if path == '/saved' }}">Saved <span class="num">{{ counts.saved }}</span></a>
  <a href="/analysis" class="{{ 'on' if path == '/analysis' }}">Analysis</a>
  <a href="/profile" class="{{ 'on' if path == '/profile' }}">Profile</a>
  <a href="/scan" class="{{ 'on' if path == '/scan' }}">Scan</a>
  <button id="theme" title="Toggle theme" aria-label="Toggle theme"><span class="moon">{{ icon("moon") }}</span><span class="sun">{{ icon("sun") }}</span></button>
  <form method="post" action="/logout"><button>Log out</button></form>
</nav>
{% endif %}
<main>{% block body %}{% endblock %}</main>
<script nonce="{{ request.state.nonce }}">
document.getElementById('theme')?.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next; try { localStorage.theme = next; } catch (e) {}
});
</script>
</body>
</html>
